
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: sk166-myfirst-ingress
  namespace: class-5

spec:
  ingressClassName: public-nginx

  rules:
    - host: sk166-myfirst-ingress.class-5.skala-pg.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sk166-myfirst-api-server
                port:
                  number: 8080
